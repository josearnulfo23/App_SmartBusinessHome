<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBusinessHome — Acceso</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  body.login-body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(135deg, #0d47a1, #1a73e8 60%, #42a5f5); }
  .login-card { background:#fff; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,0.25); padding:2rem; width:100%; max-width:420px; animation: fadeInUp 0.6s ease; }
  .login-card h1 { font-size:1.5rem; color:#0d47a1; text-align:center; margin-bottom:0.3rem; }
  .login-card p.sub { text-align:center; color:#5f6368; font-size:0.9rem; margin-bottom:1.5rem; }
  .form-group { margin-bottom:1rem; }
  .form-group label { display:block; font-weight:600; margin-bottom:0.3rem; font-size:0.9rem; }
  .form-group input { width:100%; padding:0.7rem; border:1px solid #dadce0; border-radius:10px; font-size:1rem; }
  .btn-login { width:100%; padding:0.75rem; border:none; border-radius:10px; background:linear-gradient(135deg, #1a73e8, #0d47a1); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .btn-login:hover { transform: translateY(-1px); box-shadow:0 6px 16px rgba(26,115,232,0.35); }
  .msg { margin-top:0.8rem; padding:0.6rem; border-radius:8px; font-size:0.9rem; display:none; }
  .msg.error { background:#fce8e6; color:#c62828; display:block; }
  .msg.info { background:#e8f0fe; color:#0d47a1; display:block; }
  .link { text-align:center; margin-top:1rem; font-size:0.85rem; }
  .link a { color:#1a73e8; text-decoration:none; font-weight:600; }
  @keyframes fadeInUp { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform: translateY(0);} }
</style>
</head>
<body class="login-body">
<div class="login-card">
  <h1 class="anim-title">🏠 SmartBusinessHome</h1>
  <p class="sub">Control financiero del hogar — Inicia sesión</p>
  <div id="msgBox" class="msg"></div>
  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group"><label>Usuario</label><input type="text" id="username" required placeholder="admin" autocomplete="username"></div>
    <div class="form-group"><label>Clave</label><input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"></div>
    <button type="submit" class="btn-login" id="btnLogin">Ingresar</button>
  </form>
  <form id="registerForm" onsubmit="doRegister(event)" style="display:none; margin-top:1rem; border-top:1px solid #eee; padding-top:1rem;">
    <p style="font-weight:600; margin-bottom:0.5rem;">Crear cuenta</p>
    <div class="form-group"><label>Usuario</label><input type="text" id="regUser" required></div>
    <div class="form-group"><label>Nombre mostrado</label><input type="text" id="regDisplay" placeholder="Ej: Juan"></div>
    <div class="form-group"><label>Clave (mín 6, 1 mayúscula y 1 número)</label><input type="password" id="regPass" required></div>
    <button type="submit" class="btn-login" style="background:linear-gradient(135deg,#2e7d32,#1b5e20)">Crear cuenta</button>
  </form>
  <div class="link"><a href="#" onclick="toggleRegister(event)">¿No tienes cuenta? Crear cuenta</a></div>
  <p style="text-align:center; margin-top:1rem; color:#5f6368; font-size:0.8rem;">Admin por defecto: <strong>admin</strong> / <strong>Admin123!</strong></p>
</div>
<script>
function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + (type || 'info');
  el.style.display = 'block';
}
function toggleRegister(e) {
  e.preventDefault();
  const f = document.getElementById('registerForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');
    localStorage.setItem('sbh_token', data.token);
    localStorage.setItem('sbh_user', JSON.stringify(data.user));
    location.href = '/';
  } catch(err) { showMsg(err.message, 'error'); }
  finally { btn.disabled=false; btn.textContent='Ingresar'; }
}
async function doRegister(e) {
  e.preventDefault();
  const username = document.getElementById('regUser').value.trim();
  const displayName = document.getElementById('regDisplay').value.trim();
  const password = document.getElementById('regPass').value;
  try {
    const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password, displayName }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.errores?.join(', ') || 'Error al registrar');
    showMsg('Cuenta creada. Ahora inicia sesión.', 'info');
    document.getElementById('registerForm').style.display='none';
  } catch(err){ showMsg(err.message,'error'); }
}
// Si ya hay token válido, redirigir
try {
  const tok = localStorage.getItem('sbh_token');
  if (tok) {
    fetch('/api/auth/me', { headers:{ 'Authorization':'Bearer '+tok } }).then(r=>{ if(r.ok) location.href='/'; });
  }
} catch(e){}
</script>
</body>
</html>
